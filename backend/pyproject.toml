[project]
name = "bl-dashboard-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "python-multipart",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "alembic>=1.14",
]

[project.scripts]
bl-file-parser = "file_parser.excel_reader:main"
bl-smart-analysis = "smart_analysis.engine:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
